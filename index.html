<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Shelf ― 読書メモ</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.8; margin: 0; padding: 24px 16px 64px; background: #faf7f2; color: #26221d; }
  @media (prefers-color-scheme: dark) { body { background: #1c1a17; color: #e8e2d8; } .card { background: #26231f; border-color: #3a362f; } .meta { color: #a89f92; } }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; line-height: 1.4; margin-bottom: 4px; }
  .meta { color: #6f675c; font-size: 0.9rem; }
  .card { background: #fff; border: 1px solid #e3ddd2; border-radius: 10px; padding: 16px 20px; margin: 16px 0; }
  .card a { color: inherit; text-decoration: none; display: block; }
  .card a:hover .title { text-decoration: underline; }
  .title { font-size: 1.15rem; font-weight: bold; }
  .status { display: inline-block; font-size: 0.75rem; padding: 1px 10px; border-radius: 999px; background: #c9a227; color: #fff; margin-right: 8px; }
  footer { margin-top: 48px; font-size: 0.85rem; color: #8a8175; }
</style>
</head>
<body>
<main>
  <h1>📚 Book Shelf</h1>
  <p class="meta">読んだ本ごとの読書メモ。本ごとにページが分かれています。</p>

  <div class="card">
    <a href="./sekai-wa-zouyo/">
      <span class="title">『世界は贈与でできている』</span><br>
      <span class="status">読書中</span><span class="meta">近内悠太 ― 資本主義の「すきま」を埋める倫理学／第4章まで読了（全9章）</span>
    </a>
  </div>

  <footer>最終更新 2026-11-19</footer>
</main>
</body>
</html>
